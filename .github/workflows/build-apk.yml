
name: Build QUPTAN WE EGYPT PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o QUPTAN_WE_EGYPT_PRO_PURPLE_GOLD_UI.zip -d .
          test -f quptan_src/pubspec.yaml
          test -f quptan_src/lib/main.dart

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: quptan_src
        run: flutter create --platforms=android --project-name quptan_we_egypt_pro .

      - name: Install dependencies
        working-directory: quptan_src
        run: flutter pub get

      - name: Build APK
        working-directory: quptan_src
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUPTAN-WE-EGYPT-PRO-APK
          path: quptan_src/build/app/outputs/flutter-apk/app-release.apk
