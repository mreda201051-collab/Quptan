
name: Extract QUPTAN Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          mkdir extracted
          archive=$(find . -maxdepth 1 -type f -name 'QUPTAN_PRO_COMPLETE_WHITE_GOLD_PIN_DRIVE_SOURCE.zip' | head -n 1)
          if [ -z "$archive" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          unzip -q "$archive" -d extracted
          cp -a extracted/. .
          rm -rf extracted

      - name: Save extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract QUPTAN PRO source"
          git push
