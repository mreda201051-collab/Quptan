
name: Build QUPTAN WE EGYPT PRO Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-flutter-rebuild
    paths:
      - 'QUPTAN_WE_EGYPT_PRO_NATIVE_V2_SOURCE_FIXED.zip'
      - '.github/workflows/native-flutter-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p native_build
          unzip -o "QUPTAN_WE_EGYPT_PRO_NATIVE_V2_SOURCE_FIXED.zip" -d native_build
          PROJECT_DIR="$(dirname "$(find native_build -type f -name pubspec.yaml -print -quit)")"
          test -f "$PROJECT_DIR/lib/main.dart"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: flutter create --platforms=android --org com.quptan.weegypt "$PROJECT_DIR"

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze code
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUPTAN-WE-EGYPT-PRO-NATIVE-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
