
name: Build QUPTAN HTML Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o QUPTAN_WE_EGYPT_PRO_HTML_ANDROID_v2.zip -d extracted
          test -f extracted/pubspec.yaml
          test -f extracted/assets/index.html
          test -f extracted/lib/main.dart
          echo "PROJECT_DIR=extracted" >> $GITHUB_ENV

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create . --platforms=android --org com.quptan.weegypt

      - name: Remove incompatible default widget test
        run: |
          rm -f "$PROJECT_DIR/test/widget_test.dart"

      - name: Configure Android
        run: |
          cd "$PROJECT_DIR"
          sed -i 's/android:label="quptan_we_egypt_pro"/android:label="QUPTAN WE EGYPT PRO"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Set compile SDK 36
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("android"), Path.home() / ".pub-cache"]
          pattern = re.compile(
              r'(?m)^([ \t]*compileSdk(?:Version)?[ \t]*(?:=[ \t]*)?)(?:flutter\.compileSdkVersion|[0-9]+)'
          )

          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if p.is_file() and p.name in ("build.gradle", "build.gradle.kts"):
                      try:
                          old = p.read_text()
                          new = pattern.sub(lambda m: m.group(1) + "36", old)
                          if new != old:
                              p.write_text(new)
                              print("Updated:", p)
                      except Exception:
                          pass
          PY

      - name: Run project tests
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Analyze project
        run: |
          cd "$PROJECT_DIR"
          flutter analyze

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          ls -lh "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUPTAN-HTML-ANDROID-APK
          path: extracted/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
