
name: Build QUPTAN WE EGYPT PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - quptan-navy-gold-final

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: |
          mkdir -p assets lib
          test -f index.html
          test -f main.dart
          test -f pubspec.yaml
          cp index.html assets/index.html
          cp main.dart lib/main.dart

      - name: Generate Android project
        run: flutter create --platforms=android --org com.quptan.weegypt .

      - name: Configure application
        run: |
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace(
              'android:label="quptan_we_egypt_pro"',
              'android:label="القبطان برو - QUPTAN PRO"'
          )
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: |
          flutter analyze > analyze.log 2>&1 || true
          cat analyze.log
          if grep -Eq 'error •' analyze.log; then
            echo "Dart errors found"
            exit 1
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUPTAN-WE-EGYPT-PRO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
