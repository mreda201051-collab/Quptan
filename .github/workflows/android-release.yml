
name: Build QUPTAN WE EGYPT PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o QUPTAN_WE_EGYPT_PRO_v0.4.1-dev.zip -d extracted
          PROJECT_DIR=$(find extracted -name pubspec.yaml -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.quptan.weegypt
          fi

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Remove obsolete widget test
        run: |
          cd "$PROJECT_DIR"
          rm -f test/widget_test.dart

      - name: Run tests
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUPTAN-WE-EGYPT-PRO-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
