name: Build QUPTAN WE EGYPT PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          test -f QUPTAN_WE_EGYPT_PRO_NEW_PROJECT.zip

      - name: Extract new project
        run: |
          unzip -o QUPTAN_WE_EGYPT_PRO_NEW_PROJECT.zip -d .
          test -f quptan_src/pubspec.yaml
          test -f quptan_src/lib/main.dart

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: quptan_src
        run: |
          flutter create --platforms=android --project-name quptan_we_egypt_pro .

      - name: Install packages
        working-directory: quptan_src
        run: flutter pub get

      - name: Build APK
        working-directory: quptan_src
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUPTAN-PRO-APK
          path: quptan_src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
