
name: Build QUPTAN WE EGYPT PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o QUPTAN_WE_EGYPT_PRO_v0.4.1-dev.zip -d extracted
          PROJECT_DIR=$(find extracted -name pubspec.yaml -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.quptan.weegypt
          fi

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36"

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Fix Excel export naming conflict
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("lib/ui/home_screen.dart")
          s = p.read_text()
          s = re.sub(r'\bnum\(', 'numCell(', s)
          p.write_text(s)
          print("Excel export naming fixed")
          PY

      - name: Remove obsolete widget test
        run: |
          cd "$PROJECT_DIR"
          rm -f test/widget_test.dart

      - name: Run tests
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Set Android compile SDK 36
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path("android/app").glob("build.gradle*"))

          if not files:
              raise SystemExit("Android app Gradle file not found")

          updated = False

          for p in files:
              s = p.read_text()
              s, count = re.subn(
                  r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)',
                  r'\g<1>36',
                  s
              )
              if count:
                  updated = True
              p.write_text(s)
              print("Checked:", p)

          if not updated:
              raise SystemExit("Could not update compileSdk to 36")

          print("Android compileSdk set to 36")
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUPTAN-WE-EGYPT-PRO-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
